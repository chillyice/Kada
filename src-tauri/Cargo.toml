[package]
name = "kada"
version = "1.2.1"
description = "咔哒 - 轻快跨平台快捷键工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kada-core = { path = "../crates/kada-core", default-features = false }
kada-hook = { path = "../crates/kada-hook" }
kada-actions = { path = "../crates/kada-actions", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# 片段市场的索引 / 片段下载（规划 7.2-㉕）。特性与 tauri-plugin-updater 用的那套对齐
# （rustls-no-provider + system-proxy），不新增任何编译单元。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
# reqwest 选的 TLS 后端由「进程级 crypto provider」决定，而 provider 要有人显式装
# （updater 是自己在建 client 前才装的，没检查过更新的进程里没人装过）——见 `http_get_text`。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# `macos-private-api` 是 macOS 上 `transparent()` 的编译门控（tauri 源码里
# `#[cfg(any(not(target_os = "macos"), feature = "macos-private-api"))]`）：气泡 / HUD /
# 提示框三个浮窗都要透明，缺了它 macOS 构建直接 E0599。与 `tauri.conf.json` 的
# `app.macOSPrivateApi` 成对设置，两者不一致时 `tauri build` 会按 config 改写这里。
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

# 更新器判定「当前是安装版还是免安装版」要读 NSIS 安装器写的安装目录
# （`HKCU/HKLM\Software\kada\Kada` 的默认值）。这个 crate 本来就在依赖树里
# （reqwest 的 hyper-util 用），不新增编译单元。
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[features]
default = ["automation"]
custom-protocol = ["tauri/custom-protocol"]
automation = ["kada-core/automation", "kada-actions/automation"]
