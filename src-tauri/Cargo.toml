[package]
name = "kada"
version = "0.1.0"
description = "咔哒 - 轻快跨平台快捷键工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kada-core = { path = "../crates/kada-core", default-features = false }
kada-hook = { path = "../crates/kada-hook" }
kada-actions = { path = "../crates/kada-actions", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# 片段市场的索引 / 片段下载（规划 7.2-㉕）。特性与 tauri-plugin-updater 用的那套对齐
# （rustls-no-provider + system-proxy），不新增任何编译单元。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
# reqwest 选的 TLS 后端由「进程级 crypto provider」决定，而 provider 要有人显式装
# （updater 是自己在建 client 前才装的，没检查过更新的进程里没人装过）——见 `http_get_text`。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[features]
default = ["automation"]
custom-protocol = ["tauri/custom-protocol"]
automation = ["kada-core/automation", "kada-actions/automation"]
