[package]
name = "kada-hook"
version = "0.1.0"
edition = "2021"

[dependencies]
kada-core = { path = "../kada-core", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
arboard = "3"

# 只有 win.rs 用得到：按 `cfg(windows)` 声明，免得 Linux / macOS 也去编一个用不上的
# Windows 绑定（它在非 Windows 目标上编不过）。
[target.'cfg(windows)'.dependencies]
# 罗技 HID++ 客户端（档位 C，见 `docs/底层输入能力规划.md`）：枚举 HID 集合、共享打开
# 厂商控制接口、收发 HID++ 报文。用 `windows-native` 后端（直连 hid.dll）而不是默认的
# C 后端，免得为一个 Windows 专属功能引入 cc 编译步骤；只挂在 Windows 目标上，Linux /
# macOS 的交叉检查与 CI 都不会去编它。
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
