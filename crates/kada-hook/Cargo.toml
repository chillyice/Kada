[package]
name = "kada-hook"
version = "0.1.0"
edition = "2021"

[dependencies]
kada-core = { path = "../kada-core", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
# 输入层环境诊断的进程表（`proc_listallpids` / `proc_pidpath`，见 macos.rs 的 `input_env`）。
libc = "0.2"

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
arboard = "3"

# 只有 win.rs 用得到：按 `cfg(windows)` 声明，免得 Linux / macOS 也去编一个用不上的
# Windows 绑定（它在非 Windows 目标上编不过）。
[target.'cfg(windows)'.dependencies]
# 截图 / 贴图（EXT-20）：PNG 编码。`image` 本就在依赖树里（tauri），这里只开 png feature。
image = { version = "0.25", default-features = false, features = ["png"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows = { version = "0.61", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

