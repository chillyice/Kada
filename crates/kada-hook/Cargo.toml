[package]
name = "kada-hook"
version = "0.1.0"
edition = "2021"

[dependencies]
kada-core = { path = "../kada-core" }

[target.'cfg(windows)'.dependencies]
arboard = "3"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }