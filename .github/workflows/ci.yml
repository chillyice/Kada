name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS 必须跑：macOS 输入层（CGEventTap）与前台窗口查询（辅助功能 AX）只能在 macOS 上
        # 编译，开发机（Windows）连交叉编译都做不了——wry 与 ring 的构建脚本要真的 clang。
        # 这条 job 是那份代码唯一的「编译 + 单测」验证点。
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux deps (Tauri prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Frontend install
        run: npm --prefix ui ci

      - name: Frontend build
        run: npm --prefix ui run build

      - name: Cargo tests (all crates)
        shell: bash
        run: |
          set +e
          out=$(cargo test --workspace 2>&1 | tail -80)
          code=$?
          if [ $code -ne 0 ]; then
            esc=$(printf '%s' "$out" | sed 's/%/%25/g' | tr '\n' '%0A' | tr '\r' '%0D')
            echo "::error file=ci.yml::cargo test exit=$code%0A$esc"
          fi
          exit $code

      - name: Tauri shell compiles
        run: cargo check -p kada

      - name: Basic version compiles (no automation)
        run: cargo check -p kada --no-default-features