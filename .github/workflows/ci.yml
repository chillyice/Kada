name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux deps (Tauri prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Frontend install
        run: npm --prefix ui ci

      - name: Frontend build
        run: npm --prefix ui run build

      - name: Cargo tests (all crates)
        shell: bash
        run: |
          set +e
          out=$(cargo test --workspace 2>&1 | tail -80)
          code=$?
          if [ $code -ne 0 ]; then
            esc=$(printf '%s' "$out" | sed 's/%/%25/g' | tr '\n' '%0A' | tr '\r' '%0D')
            echo "::error file=ci.yml::cargo test exit=$code%0A$esc"
          fi
          exit $code

      - name: Tauri shell compiles
        run: cargo check -p kada